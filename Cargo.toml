[package]
name = "rosu-pp-js"
version = "4.0.1"
edition = "2024"
authors = ["MaxOhn <ohn.m@hotmail.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MaxOhn/rosu-pp-js"
description = "Difficulty and performance calculation for osu!"
keywords = ["osu", "pp", "stars", "performance", "difficulty"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.69"
rosu-mods = { version = "0.4.1", default-features = false, features = ["serde"] }
rosu-pp = { git = "https://github.com/ppy-sb/rosu-pp", rev = "bc9ac3e760809201d9a29f34d0fa8b34b2bee747" }
serde = { version = "1.0.197", features = ["derive"] }
wasm-bindgen = "0.2.95"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

# https://github.com/rustwasm/wasm-pack/issues/1501#issuecomment-2898697188
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
